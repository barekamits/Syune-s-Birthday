<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>Կայքի ֆոն</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
  }
 
  body {
    /* Հիմնական ֆոնը - ամբողջ կայքի համար */
    background-image: url("https://uploads.onecompiler.io/43gpeysj6/1788476539124/bg.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Նուրբ մուգ շերտ նկարի վրա, որպեսզի տեքստը ընթեռնելի լինի */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.35);
    z-index: 0;
  }

  /* Ցուցադրական բովանդակություն, ցույց տալու համար ինչպես է երևում */
  /* Վերևի հատված - նկարը էկրանի կիսով չափ */
  .hero {
    width: 100%;
    height: 50vh;
    background-image: url("https://uploads.onecompiler.io/43gpeysj6/1788472339273/2ndlay.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    z-index: 1;
  }

  .hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.25);
  }

  /* Ջրահարսի նկարը՝ ուղիղ hero բաժնի կենտրոնում */
  .mermaid-img {
    position: absolute;
    top: 33%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-height: 70%;
    max-width: 60%;
    object-fit: contain;
    z-index: 2;
  }

  /* Ներքևի նկարը՝ ջրահարսից ներքև, ավարտվում է հենց hero-ի (երկրորդ շերտի) ստորին եզրագծի հետ */
  .bottom-img {
    position: absolute;
    bottom: 0;
    left: 50%;
    top:60%;
    transform: translateX(-50%);
    max-height: 85%;
    max-width: 80%;
    object-fit: contain;
    z-index: 2;
  }
    /* --- ՄՈԲԱՅԼԻ ՀԱՄԱՐ ՓՈՓՈԽՎԱԾ ԴԻՐՔ --- */
  @media (max-width: 360px) {
    .bottom-img {
      top: 60%;              /* <-- սա փոխիր, որպեսզի բարձրացնես/իջեցնես kamar-ը մոբայլում */
      bottom: auto;           /* հեռացրինք "bottom:0"-ն, որ top-ը միանշանակ աշխատի */
      max-height: 55%;        /* կարող ես մեծացնել/փոքրացնել kamar-ի չափը */
      max-width: 82%;
    }
  }

  /* Կրաբի նկարը՝ վերևի ձախ անկյունում */
  .crab-img {
    position: absolute;
    top: 4%;
    left: 0%;
    max-height: 28%;
    max-width: 38%;
    object-fit: contain;
    z-index: 3;
  }

  /* Ձկնիկի նկարը՝ վերևի աջ անկյունում */
  .fish-img {
    position: absolute;
    top: 4%;
    right: 3%;
    max-height: 23%;
    max-width: 18%;
    object-fit: contain;
    z-index: 3;
  }

  /* Ծննդյան պարտիի վերնագիրը՝ kamar նկարի վրա */
  .party-title {
    position: absolute;
    top: 72%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    width: 90%;
    text-align: center;
    pointer-events: none;
  }

  .party-title .welcome {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    letter-spacing: 4px;
    font-size: clamp(14px, 2.6vw, 22px);
    color: #fffdf5;
    -webkit-text-stroke: 0.5px rgba(90, 30, 90, 0.35);
    text-shadow:
      0 0 12px rgba(255, 225, 150, 0.95),
      0 2px 8px rgba(40, 0, 40, 0.75),
      0 0 22px rgba(80, 0, 80, 0.5);
    margin-bottom: 4px;
  }

  .party-title .main-line {
    display: block;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(34px, 7vw, 64px);
    line-height: 1.15;
    background: linear-gradient(180deg, #fffbea 0%, #ffe08a 40%, #ffb84d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter:
      drop-shadow(0 2px 3px rgba(40,0,40,0.6))
      drop-shadow(0 0 10px rgba(40,0,40,0.55))
      drop-shadow(0 0 20px rgba(255,210,120,0.6));
  }

  .party-title .sub-line {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    letter-spacing: 3px;
    font-size: clamp(16px, 3.2vw, 30px);
    color: #fffdf5;
    -webkit-text-stroke: 0.5px rgba(90, 30, 90, 0.35);
    text-shadow:
      0 0 12px rgba(255, 225, 150, 0.9),
      0 2px 8px rgba(40, 0, 40, 0.75),
      0 0 22px rgba(80, 0, 80, 0.5);
    margin-top: 2px;
  } 

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50vh;
    text-align: center;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }

  .content h1 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .content p {
    font-size: 15px;
    opacity: 0.7;
    max-width: 460px;
    line-height: 1.6; 
  }

  /* ===================== ՄԻՋՈՑԱՌՄԱՆ ՄԱՆՐԱՄԱՍՆԵՐ ===================== */

  .details {
    position: relative;
    z-index: 2;
    padding: 64px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* Ալիքաձև անջատիչ՝ hero-ի և մանրամասների միջև, ջրի տակից դուրս գալու տպավորություն */
  .wave-divider {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 70px;
    display: block;
    margin-top: -1px;
  }

  .wave-divider path {
    fill: rgba(6, 22, 38, 0.4);
  }

  .details-heading {
    text-align: center;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .details-heading.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  .details-heading .you-are-invited {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    letter-spacing: 3px;
    font-size: clamp(13px, 2vw, 16px);
    color: #ffe08a;
    margin-bottom: 6px;
  }

  .details-heading h2 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 400;
    background: linear-gradient(180deg, #fffbea 0%, #ffe08a 45%, #ffb84d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

  .detail-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
    max-width: 900px;
    width: 100%;
  }

  .detail-card {
    flex: 1 1 220px;
    max-width: 260px;
    background: rgba(6, 28, 46, 0.45);
    border: 1px solid rgba(255, 224, 138, 0.35);
    border-radius: 18px;
    padding: 26px 20px;
    text-align: center;
    color: #fdfaf0;
    font-family: 'Poppins', sans-serif;
    backdrop-filter: blur(6px);
    opacity: 0;
    transform: translateY(30px) scale(0.96);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .detail-card.in-view {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .detail-card:nth-child(1) { transition-delay: 0.05s; }
  .detail-card:nth-child(2) { transition-delay: 0.2s; }
  .detail-card:nth-child(3) { transition-delay: 0.35s; }

  .detail-card .icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 14px;
    display: block;
  }

  .detail-card .label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #ffe08a;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .detail-card .value {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.5;
  }

  /* Քարտեզի բլոկ - բացվում է միայն «Վայր» քարտի սեղմումով */
  .map-card {
    width: 100%;
    max-width: 900px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255, 224, 138, 0.35);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    background: rgba(6, 28, 46, 0.45);

    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    transition: grid-template-rows 0.6s ease, opacity 0.5s ease, margin-top 0.6s ease;
    margin-top: -18px;
  }

  .map-card > .map-card-inner {
    min-height: 0;
    overflow: hidden;
  }

  .map-card.open {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-top: 0;
  }

  .detail-card.location-card {
    cursor: pointer;
    position: relative;
  }

  .detail-card.location-card .hint {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #ffe08a;
    opacity: 0.75;
  }

  .detail-card.location-card:hover {
    border-color: rgba(255, 224, 138, 0.7);
  }

  .map-card iframe {
    width: 100%;
    height: 340px;
    border: 0;
    display: block;
    filter: saturate(0.9) contrast(1.02);
  }

  .map-card .map-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    flex-wrap: wrap;
  }

  .map-card .map-footer span {
    color: #fdfaf0;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    opacity: 0.85;
  }

  .map-card .map-footer a {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    color: #06182e;
    background: linear-gradient(180deg, #fffbea 0%, #ffe08a 45%, #ffb84d 100%);
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .details-heading, .detail-card, .map-card {
      transition: none;
      opacity: 1;
      transform: none;
    }
  }

  /* --- Օվկիանոսի պղպջակներ --- */
  .bubbles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 3;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    bottom: -8%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%,
        rgba(255,255,255,0.95) 0%,
        rgba(255,255,255,0.5) 8%,
        rgba(255,255,255,0.08) 30%,
        rgba(190,225,255,0.10) 55%,
        rgba(255,255,255,0.28) 92%,
        rgba(255,255,255,0.55) 100%);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow:
      inset -3px -3px 5px rgba(0,0,0,0.08),
      inset 2px 2px 4px rgba(255,255,255,0.5),
      0 0 3px rgba(255,255,255,0.15);
    opacity: 0;
    animation-name: riseWobble;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  @keyframes riseWobble {
    0%   { transform: translate(0, 0) scale(0.85); opacity: 0; }
    6%   { opacity: var(--op, 0.75); }
    22%  { transform: translate(var(--w), -22vh) scale(1); }
    45%  { transform: translate(calc(var(--w) * -1), -45vh) scale(1.05); }
    68%  { transform: translate(var(--w), -68vh) scale(0.95); }
    88%  { transform: translate(calc(var(--w) * -0.6), -88vh) scale(1.02); opacity: var(--op, 0.75); }
    100% { transform: translate(calc(var(--w) * 0.3), -112vh) scale(1.1); opacity: 0; }
  }

  .bubble:nth-child(1)  { left: 2%;  width: 9px;  height: 9px;  animation-duration: 11s; animation-delay: -2s;   --w: 14px; --op: 0.6; }
  .bubble:nth-child(2)  { left: 6%;  width: 22px; height: 22px; animation-duration: 16s; animation-delay: -9s;   --w: -22px; --op: 0.45; }
  .bubble:nth-child(3)  { left: 11%; width: 6px;  height: 6px;  animation-duration: 8s;  animation-delay: -1s;   --w: 10px; --op: 0.7; }
  .bubble:nth-child(4)  { left: 15%; width: 15px; height: 15px; animation-duration: 13s; animation-delay: -6s;   --w: -16px; --op: 0.55; }
  .bubble:nth-child(5)  { left: 20%; width: 27px; height: 27px; animation-duration: 19s; animation-delay: -13s;  --w: 24px; --op: 0.4; }
  .bubble:nth-child(6)  { left: 24%; width: 10px; height: 10px; animation-duration: 9.5s; animation-delay: -4s;  --w: -9px; --op: 0.65; }
  .bubble:nth-child(7)  { left: 29%; width: 18px; height: 18px; animation-duration: 14.5s; animation-delay: -11s; --w: 18px; --op: 0.5; }
  .bubble:nth-child(8)  { left: 34%; width: 7px;  height: 7px;  animation-duration: 8.7s; animation-delay: -2.5s; --w: -12px; --op: 0.7; }
  .bubble:nth-child(9)  { left: 38%; width: 24px; height: 24px; animation-duration: 17s; animation-delay: -8s;   --w: 21px; --op: 0.42; }
  .bubble:nth-child(10) { left: 43%; width: 12px; height: 12px; animation-duration: 10.2s; animation-delay: -5.5s; --w: -14px; --op: 0.6; }
  .bubble:nth-child(11) { left: 47%; width: 8px;  height: 8px;  animation-duration: 9s;  animation-delay: -3s;   --w: 9px; --op: 0.68; }
  .bubble:nth-child(12) { left: 52%; width: 20px; height: 20px; animation-duration: 15.5s; animation-delay: -10s; --w: -19px; --op: 0.48; }
  .bubble:nth-child(13) { left: 56%; width: 14px; height: 14px; animation-duration: 11.8s; animation-delay: -6.8s; --w: 15px; --op: 0.58; }
  .bubble:nth-child(14) { left: 61%; width: 6px;  height: 6px;  animation-duration: 7.8s; animation-delay: -1.5s; --w: -8px; --op: 0.72; }
  .bubble:nth-child(15) { left: 65%; width: 26px; height: 26px; animation-duration: 18.5s; animation-delay: -14s; --w: 23px; --op: 0.4; }
  .bubble:nth-child(16) { left: 69%; width: 11px; height: 11px; animation-duration: 10s; animation-delay: -4.5s; --w: -11px; --op: 0.62; }
  .bubble:nth-child(17) { left: 73%; width: 17px; height: 17px; animation-duration: 13.8s; animation-delay: -7.5s; --w: 17px; --op: 0.52; }
  .bubble:nth-child(18) { left: 77%; width: 9px;  height: 9px;  animation-duration: 8.9s; animation-delay: -2.2s; --w: -10px; --op: 0.66; }
  .bubble:nth-child(19) { left: 81%; width: 21px; height: 21px; animation-duration: 16.2s; animation-delay: -9.5s; --w: 20px; --op: 0.44; }
  .bubble:nth-child(20) { left: 85%; width: 13px; height: 13px; animation-duration: 11.2s; animation-delay: -5.8s; --w: -13px; --op: 0.6; }
  .bubble:nth-child(21) { left: 89%; width: 7px;  height: 7px;  animation-duration: 8.3s; animation-delay: -1.8s; --w: 9px; --op: 0.7; }
  .bubble:nth-child(22) { left: 93%; width: 19px; height: 19px; animation-duration: 14.8s; animation-delay: -11.5s; --w: -18px; --op: 0.5; }
  .bubble:nth-child(23) { left: 96%; width: 10px; height: 10px; animation-duration: 9.6s; animation-delay: -3.5s; --w: 11px; --op: 0.64; }
  .bubble:nth-child(24) { left: 4%;  width: 16px; height: 16px; animation-duration: 12.5s; animation-delay: -7s;  --w: -15px; --op: 0.55; }
  .bubble:nth-child(25) { left: 18%; width: 8px;  height: 8px;  animation-duration: 9.2s; animation-delay: -4.2s; --w: 10px; --op: 0.68; }
  .bubble:nth-child(26) { left: 32%; width: 23px; height: 23px; animation-duration: 17.6s; animation-delay: -12.4s; --w: -20px; --op: 0.42; }
  .bubble:nth-child(27) { left: 49%; width: 6px;  height: 6px;  animation-duration: 7.5s; animation-delay: -0.8s; --w: 8px; --op: 0.72; }
  .bubble:nth-child(28) { left: 63%; width: 15px; height: 15px; animation-duration: 12.9s; animation-delay: -6.2s; --w: 14px; --op: 0.56; }
  .bubble:nth-child(29) { left: 78%; width: 25px; height: 25px; animation-duration: 18.8s; animation-delay: -13.6s; --w: 22px; --op: 0.4; }
  .bubble:nth-child(30) { left: 91%; width: 12px; height: 12px; animation-duration: 10.6s; animation-delay: -5.2s; --w: -12px; --op: 0.6; }
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-overlay"></div>
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788473794061/syune.png" alt="Ջրահարս" class="mermaid-img">
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474109180/kamar.png" alt="Ներքևի նկար" class="bottom-img">

    <!-- Ծննդյան պարտիի վերնագիր՝ kamar նկարի վրա -->
    <div class="party-title">
      <span class="welcome">W E L C O M E&nbsp; T O</span>
      <span class="main-line">Syune's</span>
      <span class="sub-line">BIRTHDAY PARTY</span>
    </div>

    <!-- Կրաբի նկարը (վերևի ձախ) - փոխարինիր src-ը քո նկարով -->
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474969239/crab.png" alt="Կրաբ" class="crab-img">

    <!-- Ձկնիկի նկարը (վերևի աջ) - փոխարինիր src-ը քո նկարով -->
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474972339/dzukik.png" alt="Ձկնիկ" class="fish-img">
  </div>


  <!-- ===================== ՄԻՋՈՑԱՌՄԱՆ ՄԱՆՐԱՄԱՍՆԵՐ ===================== -->
  <section class="details">

    <div class="details-heading">
      <span class="you-are-invited">YOU'RE INVITED</span>  

    </div> 
 
    <div class="detail-cards">

      <div class="detail-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="16" rx="2" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M3 9H21" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M8 3V6" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16 3V6" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="label">ԱՄՍԱԹԻՎ</div>
        <div class="value">[Ամսաթիվ]</div>
      </div>

      <div class="detail-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M12 7V12L15.5 14" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="label">ԺԱՄ</div>
        <div class="value">[Ժամ]</div>
      </div>

      <div class="detail-card location-card" id="locationCard" role="button" tabindex="0" aria-expanded="false" aria-controls="mapCard">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21C12 21 19 14.5 19 9.5C19 5.35786 15.6421 2 11.5 2C7.35786 2 4 5.35786 4 9.5C4 14.5 12 21 12 21Z" stroke="#ffe08a" stroke-width="1.6" transform="translate(0.5,0)"/>
          <circle cx="12" cy="9.5" r="2.5" stroke="#ffe08a" stroke-width="1.6"/>
        </svg>
        <div class="label">ՎԱՅՐ</div>
        <div class="value">[Միջոցառման վայր]</div>
        <span class="hint">Տեսնել քարտեզում</span>
      </div>

    </div>

    <!-- Քարտեզ. ի սկզբանե թաքցված է, երևում է «Վայր» քարտի սեղմումով -->
    <!-- iframe-ի src-ում "Yerevan, Armenia" հատվածը փոխարինիր փաստացի հասցեով -->
    <div class="map-card" id="mapCard">
      <div class="map-card-inner">
        <iframe
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="https://www.google.com/maps?q=Yerevan,+Armenia&output=embed">
        </iframe>
        <div class="map-footer">
          <span>[Հասցեն կնշվի այստեղ]</span>
          <a href="https://www.google.com/maps/search/?api=1&query=Yerevan,+Armenia" target="_blank" rel="noopener">Բացել Google Maps-ում</a>
        </div>
      </div>
    </div>

  </section>

  <div class="overlay"></div>

  <div class="bubbles">
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
    <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  </div>

  <div class="content">

  </div>

  <script>
    // Անիմացիա՝ մանրամասների բլոկների համար, երբ դրանք հայտնվում են էկրանին
    const animatedEls = document.querySelectorAll('.details-heading, .detail-card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    animatedEls.forEach(el => observer.observe(el));

    // Քարտեզը բացվում/փակվում է «Վայր» քարտի սեղմումով
    const locationCard = document.getElementById('locationCard');
    const mapCard = document.getElementById('mapCard');
    locationCard.addEventListener('click', () => {
      const isOpen = mapCard.classList.toggle('open');
      locationCard.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      if (isOpen) {
        mapCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
    locationCard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        locationCard.click();
      }
    });
  </script>

</body>
