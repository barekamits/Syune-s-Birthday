<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>Կայքի ֆոն</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; width:100%; }
  body {
    background-image: url("https://uploads.onecompiler.io/43gpeysj6/1788476539124/bg.jpg");
    background-size: cover; background-position: center; background-repeat: no-repeat;
    background-attachment: fixed; min-height:100vh; position:relative; overflow-x:hidden;
  }
  .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.35); z-index:0; }
  .hero {
    width:100%; height:50vh;
    background-image: url("https://uploads.onecompiler.io/43gpeysj6/1788472339273/2ndlay.jpg");
    background-size:cover; background-position:center; background-repeat:no-repeat;
    position:relative; z-index:1;
  }
  .hero-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.25); }
  .mermaid-img { position:absolute; top:33%; left:50%; transform:translate(-50%,-50%); max-height:70%; max-width:60%; object-fit:contain; z-index:2; }

  /* --- ՓՈՓՈԽՎԱԾ մաս. kamar.png-ի դիրքը --- */
  .bottom-img {
    position:absolute;
    top: 40%;              /* <-- սա փոխիր, որպեսզի բարձրացնես/իջեցնես kamar-ը */
    left:50%;
    bottom:auto;            /* հեռացրինք "bottom:0"-ն, որ top-ը միանշանակ աշխատի */
    transform: translateX(-50%);
    max-height: 55%;        /* կարող ես մեծացնել/փոքրացնել kamar-ի չափը */
    max-width: 82%;
    object-fit: contain;
    z-index:2;
  }

  .crab-img { position:absolute; top:4%; left:0%; max-height:28%; max-width:38%; object-fit:contain; z-index:3; }
  .fish-img { position:absolute; top:4%; right:3%; max-height:23%; max-width:18%; object-fit:contain; z-index:3; }
  .party-title { position:absolute; top:72%; left:50%; transform:translate(-50%,-50%); z-index:4; width:90%; text-align:center; pointer-events:none; }
  .party-title .welcome { display:block; font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:4px; font-size:clamp(14px,2.6vw,22px); color:#fffdf5; -webkit-text-stroke:0.5px rgba(90,30,90,0.35); text-shadow:0 0 12px rgba(255,225,150,0.95),0 2px 8px rgba(40,0,40,0.75),0 0 22px rgba(80,0,80,0.5); margin-bottom:4px; }
  .party-title .main-line { display:block; font-family:'Great Vibes',cursive; font-size:clamp(34px,7vw,64px); line-height:1.15; background:linear-gradient(180deg,#fffbea 0%,#ffe08a 40%,#ffb84d 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 3px rgba(40,0,40,0.6)) drop-shadow(0 0 10px rgba(40,0,40,0.55)) drop-shadow(0 0 20px rgba(255,210,120,0.6)); }
  .party-title .sub-line { display:block; font-family:'Poppins',sans-serif; font-weight:600; letter-spacing:3px; font-size:clamp(16px,3.2vw,30px); color:#fffdf5; -webkit-text-stroke:0.5px rgba(90,30,90,0.35); text-shadow:0 0 12px rgba(255,225,150,0.9),0 2px 8px rgba(40,0,40,0.75),0 0 22px rgba(80,0,80,0.5); margin-top:2px; }
  .content { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; min-height:50vh; text-align:center; color:#fff; font-family:-apple-system,"Segoe UI",Arial,sans-serif; }
  .details { position:relative; z-index:2; padding:64px 20px 80px; display:flex; flex-direction:column; align-items:center; gap:40px; }
  .details-heading { text-align:center; opacity:1; }
  .details-heading .you-are-invited { display:block; font-family:'Poppins',sans-serif; font-weight:600; letter-spacing:3px; font-size:clamp(13px,2vw,16px); color:#ffe08a; margin-bottom:6px; }
  .detail-cards { display:flex; flex-wrap:wrap; justify-content:center; gap:22px; max-width:900px; width:100%; }
  .detail-card { flex:1 1 220px; max-width:260px; background:rgba(6,28,46,0.45); border:1px solid rgba(255,224,138,0.35); border-radius:18px; padding:26px 20px; text-align:center; color:#fdfaf0; font-family:'Poppins',sans-serif; backdrop-filter:blur(6px); opacity:1; }
  .detail-card .icon { width:40px; height:40px; margin:0 auto 14px; display:block; }
  .detail-card .label { font-size:12px; letter-spacing:2px; color:#ffe08a; font-weight:600; margin-bottom:8px; }
  .detail-card .value { font-size:17px; font-weight:600; line-height:1.5; }
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-overlay"></div>
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788473794061/syune.png" alt="Ջրահարս" class="mermaid-img">
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474109180/kamar.png" alt="Ներքևի նկար" class="bottom-img">
    <div class="party-title">
      <span class="welcome">W E L C O M E&nbsp; T O</span>
      <span class="main-line">Syune's</span>
      <span class="sub-line">BIRTHDAY PARTY</span>
    </div>
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474969239/crab.png" alt="Կրաբ" class="crab-img">
    <img src="https://uploads.onecompiler.io/43gpeysj6/1788474972339/dzukik.png" alt="Ձկնիկ" class="fish-img">
  </div>

  <section class="details">
    <div class="details-heading">
      <span class="you-are-invited">YOU'RE INVITED</span>
    </div>
    <div class="detail-cards">
      <div class="detail-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="16" rx="2" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M3 9H21" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M8 3V6" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16 3V6" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="label">ԱՄՍԱԹԻՎ</div>
        <div class="value">[Ամսաթիվ]</div>
      </div>
      <div class="detail-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#ffe08a" stroke-width="1.6"/>
          <path d="M12 7V12L15.5 14" stroke="#ffe08a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="label">ԺԱՄ</div>
        <div class="value">[Ժամ]</div>
      </div>
      <div class="detail-card location-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21C12 21 19 14.5 19 9.5C19 5.35786 15.6421 2 11.5 2C7.35786 2 4 5.35786 4 9.5C4 14.5 12 21 12 21Z" stroke="#ffe08a" stroke-width="1.6" transform="translate(0.5,0)"/>
          <circle cx="12" cy="9.5" r="2.5" stroke="#ffe08a" stroke-width="1.6"/>
        </svg>
        <div class="label">ՎԱՅՐ</div>
        <div class="value">[Միջոցառման վայր]</div>
      </div>
    </div>
  </section>
  <div class="overlay"></div>
</body>
</html>
